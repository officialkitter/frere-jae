project_id = "jae-tanzanite"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
max_rows = 100

[db]
port = 54322
major_version = 15

[auth]
enabled = true
site_url = "jae://auth-callback"
additional_redirect_urls = ["jae://auth-callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
minimum_password_length = 10

[realtime]
enabled = true

[storage]
enabled = true
