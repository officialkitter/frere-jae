name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --passWithNoTests

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Start local Supabase and apply migrations + seed
        run: supabase start
      - name: Verify every public table has RLS enabled
        run: |
          missing=$(supabase db query "select tablename from pg_tables where schemaname='public' and not rowsecurity" --output csv | tail -n +2)
          if [ -n "$missing" ]; then echo "Tables without RLS: $missing"; exit 1; fi
      - run: supabase stop
